name: Sync Online Ollama Model Library Catalog

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Official Plugin Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync live model library from ollama.com
        run: node scripts/sync-library-catalog.js

      - name: Commit updated library catalog if changed
        run: |
          git config user.name "OPF Catalog Bot"
          git config user.email "opf-bot@users.noreply.github.com"
          git add catalog/ollama-library.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync live Ollama online model library catalog"
            git push
          else
            echo "Catalog is already up to date."
          fi
